<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #17363a;
    --teal-2: #214a4f;
    --paper: #f2f5f6;
    --ink: #1a2326;
    --muted: #6b7a7e;
    --accent: #e4572e;
    --line: #d9e0e2;
    --sans: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root { --surface: #fff; }
  [data-theme="dark"] {
    color-scheme: dark;
    --paper: #121a1c; --surface: #192326; --ink: #e6eef0; --muted: #8da1a5;
    --line: #2a3a3e; --teal: #0e2124; --teal-2: #1a3a3f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--sans); background: var(--paper); color: var(--ink); }
  [hidden] { display: none !important; }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* login */
  #login { height: 100%; display: grid; place-items: center; background: var(--teal); padding: 24px; }
  #login form { width: min(380px, 100%); display: grid; gap: 14px; }
  #login h1 { margin: 0; font-size: 2.6rem; font-weight: 800; line-height: 1; color: #fff; letter-spacing: -0.02em; }
  #login p { margin: 0; color: #a9c1c4; }
  #login input { padding: 14px 16px; border: 0; border-radius: 10px; background: #fff; color: var(--ink); }
  #login button, #send button {
    padding: 14px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  #login-error { color: #ffb4a0; min-height: 1.2em; font-size: .9rem; }

  /* layout */
  #app { height: 100%; display: grid; grid-template-columns: 250px 1fr; }
  aside { background: var(--teal); color: #cfe0e2; display: flex; flex-direction: column; padding: 18px 12px; gap: 18px; min-height: 0; }
  aside h1 { margin: 0 8px; font-size: 1.25rem; font-weight: 800; color: #fff; }
  aside h2 { margin: 0 8px 6px; font-size: .85rem; font-weight: 600; color: #8fb0b4; }
  #channels { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .ch {
    text-align: left; border: 0; background: none; color: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .ch:hover { background: var(--teal-2); }
  .ch.active { background: var(--accent); color: #fff; font-weight: 600; }
  #newch { display: flex; gap: 6px; margin: 0 4px; }
  #newch input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--teal-2); border-radius: 8px; background: transparent; color: #fff; }
  #newch input::placeholder { color: #6f9196; }
  #newch button { border: 0; border-radius: 8px; padding: 0 12px; background: var(--teal-2); color: #fff; cursor: pointer; }
  #newch-error { margin: 0 8px; color: #ffb4a0; font-size: .85rem; min-height: 1em; }
  #online { list-style: none; margin: 0; padding: 0 8px; display: grid; gap: 4px; overflow-y: auto; }
  #online li::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #5ed38a; }
  #online-wrap { min-height: 0; margin-top: auto; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #chname { padding: 16px 22px; font-weight: 800; font-size: 1.15rem; border-bottom: 1px solid var(--line); background: var(--surface); }
  #msgs { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: grid; grid-template-columns: 38px 1fr; gap: 12px; max-width: 70ch; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .meta { display: flex; gap: 8px; align-items: baseline; }
  .meta b { font-weight: 600; }
  .meta time { color: var(--muted); font-size: .8rem; }
  .txt { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
  .empty { color: var(--muted); margin: auto; }
  #send { display: flex; gap: 10px; padding: 14px 22px; background: var(--surface); border-top: 1px solid var(--line); }
  #send input { flex: 1; min-width: 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }

  @media (max-width: 720px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { flex-direction: row; align-items: center; padding: 10px; gap: 10px; overflow-x: auto; }
    aside h1, aside h2, #online-wrap, #newch-error { display: none; }
    #channels { flex-direction: row; overflow: visible; }
    .ch { white-space: nowrap; }
    #newch { flex-shrink: 0; width: 170px; }
  }
  @media (prefers-reduced-motion: no-preference) { .ch { transition: background .12s; } }
  main { position: relative; }
  .av { font-size: 18px; }
  .av.big { width: 64px; height: 64px; font-size: 32px; }
  #send input { color: var(--ink); }
  #emoji-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 0 12px; font-size: 20px; cursor: pointer; }
  #picker { position: absolute; left: 22px; bottom: 78px; width: min(300px, calc(100% - 44px)); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 5; }
  #picker button { border: 0; background: none; font-size: 22px; padding: 6px; border-radius: 8px; cursor: pointer; }
  #picker button:hover { background: var(--paper); }
  .side-actions { display: flex; gap: 6px; margin: 0 4px; }
  .side-actions button { flex: 1; border: 0; background: var(--teal-2); color: #fff; border-radius: 8px; padding: 8px; cursor: pointer; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 20px; width: min(340px, 90vw); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 12px; }
  dialog .av { margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; }
  .sw { height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw.sel { border-color: var(--ink); }
  .eb { border: 2px solid transparent; background: var(--paper); border-radius: 10px; font-size: 22px; padding: 6px; cursor: pointer; }
  .eb.sel { border-color: var(--accent); }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (max-width: 720px) { .side-actions { flex-shrink: 0; } #picker { left: 10px; } }
</style>
</head>
<body>

<section id="login">
  <form id="login-form">
    <h1>Group chat</h1>
    <p>Pick a username to join.</p>
    <input id="login-name" maxlength="20" placeholder="Username" autocomplete="off" required>
    <button type="submit">Join chat</button>
    <div id="login-error" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <aside>
    <h1>Group chat</h1>
    <div>
      <h2>Channels</h2>
      <nav id="channels"></nav>
    </div>
    <form id="newch">
      <input id="newch-name" maxlength="24" placeholder="New channel" autocomplete="off">
      <button type="submit" aria-label="Create channel">+</button>
    </form>
    <div id="newch-error" role="alert"></div>
    <div class="side-actions">
      <button id="profile-btn" type="button">Avatar</button>
      <button id="theme-btn" type="button">Dark mode</button>
    </div>
    <div id="online-wrap">
      <h2>Online</h2>
      <ul id="online"></ul>
    </div>
  </aside>
  <main>
    <div id="chname"></div>
    <div id="msgs" aria-live="polite"></div>
    <div id="picker" hidden></div>
    <form id="send">
      <button type="button" id="emoji-btn" aria-label="Emoji">😊</button>
      <input id="send-text" maxlength="2000" placeholder="Write a message" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </main>
</div>

<dialog id="profile">
  <h3>Your avatar</h3>
  <div id="prev" class="av big"></div>
  <div id="swatches" class="grid"></div>
  <div id="emojis" class="grid"></div>
  <div class="row">
    <button type="button" class="btn" id="no-emoji">Use my initial</button>
    <button type="button" class="btn" id="cancel-av">Cancel</button>
    <button type="button" class="btn primary" id="save-av">Save</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const socket = window.SERVER_URL ? io(window.SERVER_URL) : io();
let me = null, channels = [], current = null;
const avatars = {};
let myAvatar = JSON.parse(localStorage.getItem('chat-avatar') || 'null');
const defColor = (n) => `hsl(${hue(n)} 45% 38%)`;
function paint(el, u) {
  const a = avatars[u] || {};
  el.style.background = a.color || defColor(u);
  el.textContent = a.emoji || u[0].toUpperCase();
}

function hue(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const _unused = (n) => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const fmt = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function join(name) {
  return new Promise((resolve) => socket.emit('join', { name, avatar: myAvatar }, resolve));
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await join($('#login-name').value);
  if (res.error) { $('#login-error').textContent = res.error; return; }
  me = res.name;
  if (res.avatar) avatars[me] = res.avatar;
  localStorage.setItem('chat-name', me);
  channels = res.channels;
  $('#login').hidden = true;
  $('#app').hidden = false;
  renderChannels();
  renderOnline(res.online);
  openChannel(channels[0].id);
  $('#send-text').focus();
});

// Re-join automatically if the connection drops and comes back
socket.on('connect', async () => {
  if (!me) return;
  const res = await join(me);
  if (res.ok && current) openChannel(current);
});

function renderChannels() {
  const box = $('#channels');
  box.replaceChildren();
  for (const c of channels) {
    const b = document.createElement('button');
    b.className = 'ch' + (c.id === current ? ' active' : '');
    b.textContent = '# ' + c.name;
    b.onclick = () => openChannel(c.id);
    box.append(b);
  }
}

function renderOnline(names) {
  $('#online').replaceChildren(...names.map((n) => {
    const li = document.createElement('li');
    li.textContent = n;
    return li;
  }));
}

function addMessage(m) {
  const list = $('#msgs');
  list.querySelector('.empty')?.remove();
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  const row = document.createElement('div');
  row.className = 'msg';
  if (m.color || m.emoji) avatars[m.username] = { color: m.color, emoji: m.emoji };
  const av = document.createElement('div');
  av.className = 'av';
  av.dataset.user = m.username;
  paint(av, m.username);
  const body = document.createElement('div');
  const meta = document.createElement('div');
  meta.className = 'meta';
  const name = document.createElement('b'); name.textContent = m.username;
  const time = document.createElement('time'); time.textContent = fmt(m.createdAt);
  meta.append(name, time);
  const txt = document.createElement('div');
  txt.className = 'txt';
  txt.textContent = m.text;
  body.append(meta, txt);
  row.append(av, body);
  list.append(row);
  if (nearBottom || m.username === me) list.scrollTop = list.scrollHeight;
}

function openChannel(id) {
  current = id;
  renderChannels();
  $('#chname').textContent = '# ' + channels.find((c) => c.id === id).name;
  socket.emit('open', id, (history) => {
    if (current !== id) return;
    const list = $('#msgs');
    list.replaceChildren();
    if (!history.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No messages yet. Say something.';
      list.append(p);
    }
    history.forEach(addMessage);
    list.scrollTop = list.scrollHeight;
  });
}

$('#send').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('#send-text');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('message', { channelId: current, text });
  input.value = '';
});

$('#newch').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('#newch-name');
  socket.emit('create_channel', input.value, (res) => {
    $('#newch-error').textContent = res.error || '';
    if (res.ok) input.value = '';
  });
});

socket.on('message', (m) => { if (m.channelId === current) addMessage(m); });
socket.on('channels', (list) => { channels = list; renderChannels(); });
socket.on('online', renderOnline);

// ----- avatar -----
const COLORS = ['#2f7d4f', '#3b6fd4', '#8b4fd1', '#d1478a', '#e4572e', '#d99a1a', '#2a9d9d', '#5b6770'];
const AV_EMOJI = ['😀','😎','🤖','👻','🐱','🐶','🦊','🐸','🐼','🦄','🔥','⭐','🌈','🍕','🎮','🎧','🚀','💀','👽','🌵'];
let draft = {};
function renderDraft() {
  const prev = $('#prev');
  prev.style.background = draft.color || defColor(me);
  prev.textContent = draft.emoji || me[0].toUpperCase();
  document.querySelectorAll('.sw').forEach((b) => b.classList.toggle('sel', b.dataset.v === draft.color));
  document.querySelectorAll('.eb').forEach((b) => b.classList.toggle('sel', b.dataset.v === draft.emoji));
}
for (const c of COLORS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'sw'; b.dataset.v = c; b.style.background = c;
  b.setAttribute('aria-label', 'Color ' + c);
  b.onclick = () => { draft.color = c; renderDraft(); };
  $('#swatches').append(b);
}
for (const e of AV_EMOJI) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'eb'; b.dataset.v = e; b.textContent = e;
  b.onclick = () => { draft.emoji = e; renderDraft(); };
  $('#emojis').append(b);
}
$('#profile-btn').onclick = () => {
  draft = { color: avatars[me]?.color || null, emoji: avatars[me]?.emoji || null };
  renderDraft();
  $('#profile').showModal();
};
$('#no-emoji').onclick = () => { draft.emoji = null; renderDraft(); };
$('#cancel-av').onclick = () => $('#profile').close();
$('#save-av').onclick = () => {
  myAvatar = { color: draft.color, emoji: draft.emoji };
  localStorage.setItem('chat-avatar', JSON.stringify(myAvatar));
  socket.emit('set_avatar', myAvatar);
  $('#profile').close();
};
socket.on('avatar', ({ username, color, emoji }) => {
  avatars[username] = { color, emoji };
  document.querySelectorAll('.av[data-user]').forEach((el) => { if (el.dataset.user === username) paint(el, username); });
});

// ----- emoji picker -----
const PICK = ['😀','😂','🥹','😍','😎','🤔','😭','😡','👍','👎','👏','🙏','🔥','❤️','💀','🎉','👀','💯','✨','🤝','😴','🤯','🥳','😅','🫡','🤖','🍕','🎮','🐸','☕'];
for (const e of PICK) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = e;
  b.onclick = () => {
    const i = $('#send-text'), pos = i.selectionStart ?? i.value.length;
    i.value = i.value.slice(0, pos) + e + i.value.slice(i.selectionEnd ?? pos);
    i.focus(); i.setSelectionRange(pos + e.length, pos + e.length);
  };
  $('#picker').append(b);
}
$('#emoji-btn').onclick = (ev) => { ev.stopPropagation(); $('#picker').hidden = !$('#picker').hidden; };
document.addEventListener('click', (ev) => { if (!ev.target.closest('#picker')) $('#picker').hidden = true; });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') $('#picker').hidden = true; });

// ----- theme -----
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('chat-theme', t);
  $('#theme-btn').textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
}
$('#theme-btn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
setTheme(localStorage.getItem('chat-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#newch-name').addEventListener('input', () => { $('#newch-error').textContent = ''; });

$('#login-name').value = localStorage.getItem('chat-name') || '';
</script>
</body>
</html>
